<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>hi html viewer</title>
    <meta name="darkreader-lock">
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link type="text/css" rel="stylesheet" href="src/theme_config.css">
    <link type="text/css" rel="stylesheet" href="src/main_ui.css">
    <script type="text/javascript" src="src/main_function.js"></script>
    <script type="text/javascript" src="src/add_render.js"></script>
</head>
<body>
<header id="hi_html_viewer_side" role="banner">
    <div id="hi_html_viewer_top_side">
        <a id="hi_html_viewer_app_title"></a>
        <button id="hi_html_viewer_left_button" onclick="hi_html_viewer_left()" title="返回">←</button>
        <button id="hi_html_viewer_right_button" onclick="hi_html_viewer_right()" title="前进">→</button>
        <button id="hi_html_viewer_refresh_button" onclick="hi_html_viewer_refresh_frame()" title="刷新">⟳</button>
        <input type="text" id="hi_html_viewer_text_url" title="输入URL"></input>
        <button id="hi_html_viewer_menu_button" onclick="hi_html_viewer_menu_show()" title="菜单">☰</button>
        <button id="hi_html_viewer_full-screen_button" onclick="hi_html_viewer_menu_full_screen()" title="全屏">⛶</button>
        <br>
    </div>
    <div id="hi_html_viewer_menu" style="display: none;">
        <div id="hi_html_viewer_menu_side" role="menubar">
            <button id="hi_html_viewer_open-file_button" title="打开文件" onclick="document.getElementById('hi_html_viewer_open_file_input').click()">打开文件</button>
            <button id="hi_html_viewer_clean_button" title="清空内容" onclick="hi_html_viewer_clean()">清空内容</button>
            <button id="hi_html_viewer_url_button" title="输入URL" onclick="hi_html_viewer_url()">输入URL</button>
            <button id="hi_html_viewer_copy-url_button" title="复制URL" onclick="hi_html_viewer_copy_url()">复制URL</button>
            <button id="hi_html_viewer_copy-file_button" title="拷贝文件" onclick="hi_html_viewer_copy_file()">拷贝文件</button>
            <button id="hi_html_viewer_input-code_button" title="输入代码" onclick="hi_html_viewer_input_code()">输入代码</button>
            <button id="hi_html_viewer_clipboard-code_button" title="粘贴代码" onclick="hi_html_viewer_clipboard_code()">粘贴代码</button>
            <button id="hi_html_viewer_option_show_button" title="选项..." onclick="hi_html_viewer_option_show()">选项...</button>
            <input type="file" id="hi_html_viewer_open_file_input" style="display: none;" onchange="hi_html_viewer_open_file(this)">
        </div>
        <dialog id="hi_html_viewer_option" role="dialog" aria-labelledby="选项" close>
            <span id="hi_html_viewer_option_title" style="float:left;">选项</span>
            <button id="hi_html_viewer_option_hide_title_button" title="关闭窗口" onclick="hi_html_viewer_option_hide()" style="float:right;">✕</button>
            <br>
            <div>
                <div style="border-bottom: 1px solid var(--hi_html_viewer-main-color);margin-top: 8px;"></div>
                <input type="radio" id="hi_html_viewer_option_settings_button" name="option_page" value="hi_html_viewer_option_settings_button" checked>
                <label for="hi_html_viewer_option_settings_button" id="hi_html_viewer_option_choose_settings_button">偏好设置</label>
                <input type="radio" id="hi_html_viewer_option_about_button" name="option_page" value="hi_html_viewer_option_about_button">
                <label for="hi_html_viewer_option_about_button" id="hi_html_viewer_option_choose_about_button">关于项目</label>
                <div style="border-bottom: 1px solid var(--hi_html_viewer-main-color);margin-top: 8px;"></div>
                <div id="hi_html_viewer_option_settings">
                    <h2 id="hi_html_viewer_option_settings_tag">偏好设置</h2>
                    <div>
                        <span id="hi_html_viewer_show_utf-8_title">链接的内容转换成UTF-8字符</span>
                        <select id="hi_html_viewer_show_utf-8" title="链接的内容转换成UTF-8字符">
                            <option id="hi_html_viewer_show_utf-8_select_option_1" value="yes" selected>转换</option>
                            <option id="hi_html_viewer_show_utf-8_select_option_2" value="no">不转换</option>
                        </select>
                    </div>
                    <br>
                    <div>
                        <span id="hi_html_viewer_top_side_transparent_title">顶部栏和菜单栏的透明化</span>
                        <select id="hi_html_viewer_top_side_transparent" title="顶部栏和菜单栏的透明化">
                            <option id="hi_html_viewer_top_side_transparent_select_option_1" value="yes">透明</option>
                            <option id="hi_html_viewer_top_side_transparent_select_option_2" value="more">更透明</option>
                            <option id="hi_html_viewer_top_side_transparent_select_option_3" value="no" selected>不透明</option>
                        </select>
                    </div>
                    <br>
                    <div>
                        <span id="hi_html_viewer_backgorund_transparent_title">框架透明化</span>
                        <select id="hi_html_viewer_backgorund_transparent" title="框架透明化">
                            <option id="hi_html_viewer_backgorund_transparent_select_option_1" value="yes" selected>透明</option>
                            <option id="hi_html_viewer_backgorund_transparent_select_option_2" value="no">不透明</option>
                        </select>
                    </div>
                    <br>
                    <div>
                        <span id="hi_html_viewer_choose_theme_title">应用主题偏好</span>
                        <select id="hi_html_viewer_choose_theme" title="应用主题偏好">
                            <option id="hi_html_viewer_choose_theme_select_option_1" value="system-theme" selected>系统主题</option>
                            <option id="hi_html_viewer_choose_theme_select_option_2" value="light-theme">浅色主题</option>
                            <option id="hi_html_viewer_choose_theme_select_option_3" value="dark-theme">深色主题</option>
                        </select>
                    </div>
                    <br>
                    <div>
                        <span id="hi_html_viewer_app_language_title">语言</span>
                        <select id="hi_html_viewer_app_language" title="语言">
                            <option value="简体中文" selected>简体中文</option>
                            <option value="繁體中文">繁體中文</option>
                            <option value="english">English</option>
                        </select>
                    </div>
                    <br>
                    <div>
                        <span id="hi_html_viewer_app_data_clean_title">本地存储</span>
                        <button id="hi_html_viewer_app_data_clean" title="清空本地存储数据" onclick="hi_html_viewer_app_data_clean()">清空本地存储数据</button>
                    </div>
                    <br>
                </div>
                <div id="hi_html_viewer_option_about">
                    <h2 id="hi_html_viewer_option_about_tag">关于项目</h2>
                    <h3>hi html viewer</h3>
                    <p id="hi_html_viewer_option_about_describe">一个轻量多功能的html查看器</p>
                    <p>v1.6.5</p>
                    <button title="访问仓库" id="hi_html_viewer_option_open_repository_button" onclick="hi_html_viewer_option_open_repository()" role="link">访问仓库</button>
                    <span>|</span>
                    <button title="访问版本库" id="hi_html_viewer_option_open_releases_button" onclick="hi_html_viewer_option_open_releases()" role="link">访问版本库</button>
                </div>
            </div>
            <div style="border-bottom: 1px solid var(--hi_html_viewer-main-color);margin-bottom: 11px;"></div>
            <button id="hi_html_viewer_option_hide_button" title="关闭窗口" onclick="hi_html_viewer_option_hide()" style="width: 100%;">关闭窗口</button>
        </dialog>
    </div>
</header>
<iframe id="hi_html_viewer_main_preview" title="hi html viewer" frameBorder="0" width="100%" height="100%" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-top-navigation-by-user-activation allow-same-origin" src="data:text/html;text," role="main"></iframe>
</body>
</html>
